<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1016">
  <title>Muscu Atlas</title>
  <meta name="description" content="Corps 3D interactif, exercices par muscle, suivi de séances et statistiques de musculation.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%235b8cff'/><path d='M14 26h6v12h-6zM44 26h6v12h-6zM20 30h24v4H20z' fill='white'/></svg>">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">◆</span> Muscu Atlas</div>
    <nav class="tabs" id="tabs">
      <button data-tab="body" class="active"><span class="ic">◎</span><span>Corps</span></button>
      <button data-tab="workout"><span class="ic">▶</span><span>Séance</span><i class="dot" id="activeDot" hidden></i></button>
      <button data-tab="stats"><span class="ic">▤</span><span>Stats</span></button>
      <button data-tab="history"><span class="ic">☰</span><span>Historique</span></button>
    </nav>
  </header>

  <main>
    <!-- CORPS -->
    <section id="tab-body" class="tab active">
      <div class="body-layout">
        <div class="viewer" id="viewer">
          <div class="seg" id="modeSeg">
            <button data-mode="anatomy" class="active">Anatomie</button>
            <button data-mode="volume">Volume 7 j</button>
            <button data-mode="recovery">Récupération</button>
          </div>
          <div class="legend" id="legend" hidden></div>
          <div class="views">
            <button data-view="front">Face</button>
            <button data-view="back">Dos</button>
            <button data-view="left">Gauche</button>
            <button data-view="right">Droite</button>
            <button id="autoRot" title="Rotation automatique">⟳</button>
          </div>
          <div class="hint" id="hint">Glisser pour tourner · molette / pincer pour zoomer · cliquer un muscle</div>
          <div class="tooltip" id="tooltip" hidden></div>
          <div class="gl-error" id="glError" hidden>WebGL indisponible sur ce navigateur : utilisez la liste des muscles.</div>
        </div>
        <aside class="panel" id="musclePanel"></aside>
      </div>
    </section>

    <!-- SÉANCE -->
    <section id="tab-workout" class="tab"><div class="wrap" id="workoutView"></div></section>

    <!-- STATS -->
    <section id="tab-stats" class="tab"><div class="wrap" id="statsView"></div></section>

    <!-- HISTORIQUE -->
    <section id="tab-history" class="tab"><div class="wrap" id="historyView"></div></section>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="Fermer">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <div class="rest" id="rest" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
