<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1016">
  <title>Muscu Atlas</title>
  <meta name="description" content="Atlas anatomique 3D : muscles cliquables, fiches exercices détaillées et générateur de séances adapté à l'équipement Basic-Fit.">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Muscu Atlas">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="logo-img" src="icons/icon-192.png" alt=""> Muscu Atlas</div>
    <nav class="tabs" id="tabs">
      <button data-tab="body" class="active"><span class="ic">◎</span><span>Corps</span></button>
      <button data-tab="library"><span class="ic">☰</span><span>Exercices</span></button>
      <button data-tab="session"><span class="ic">▶</span><span>Séance</span></button>
      <button data-tab="gym"><span class="ic">⚙</span><span>Ma salle</span></button>
    </nav>
  </header>

  <main>
    <section id="tab-body" class="tab active">
      <div class="body-layout">
        <div class="viewer" id="viewer">
          <div class="legend" id="legend" hidden></div>
          <div class="views">
            <button data-view="front">Face</button>
            <button data-view="back">Dos</button>
            <button data-view="left">Profil</button>
            <button data-focus="upper">Haut</button>
            <button data-focus="lower">Bas</button>
            <button data-focus="all">Tout</button>
            <button id="autoRot" title="Rotation automatique">⟳</button>
          </div>
          <div class="hint">Glisser pour tourner · molette / pincer pour zoomer · clic droit / 2 doigts pour déplacer</div>
          <div class="loading" id="loading"><div>Chargement du modèle anatomique…</div><div class="lbar"><i id="loadBar"></i></div></div>
          <div class="tooltip" id="tooltip" hidden></div>
          <div class="gl-error" id="glError" hidden>Affichage 3D indisponible sur ce navigateur : utilise la liste des muscles.</div>
          <div class="credit">Modèle : Z-Anatomy / BodyParts3D · CC BY-SA 4.0</div>
        </div>
        <aside class="panel" id="musclePanel"></aside>
      </div>
    </section>
    <section id="tab-library" class="tab"><div class="wrap" id="libraryView"></div></section>
    <section id="tab-session" class="tab"><div class="wrap" id="sessionView"></div></section>
    <section id="tab-gym" class="tab"><div class="wrap" id="gymView"></div></section>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="Fermer">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
