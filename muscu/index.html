<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1016">
  <title>Muscu Atlas</title>
  <meta name="description" content="Atlas anatomique 3D : muscles cliquables, fiches exercices détaillées et générateur de séances adapté à l'équipement Basic-Fit.">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Muscu Atlas">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><img class="logo-img" src="icons/icon-192.png" alt=""><span>Muscu Atlas</span></div>
    <button class="hbtn" id="openGym" title="Matériel de ta salle et sources">
      <svg viewBox="0 0 24 24"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg><span>Ma salle</span>
    </button>
  </header>

  <main>
    <section id="tab-body" class="tab active">
      <div class="viewer" id="viewer">
        <div class="vbar">
          <div class="seg" id="viewSeg">
            <button data-view="front" class="on">Face</button><button data-view="back">Dos</button><button data-view="left">Profil</button>
          </div>
          <button class="ibtn" id="resetView" title="Recentrer"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
          <button class="ibtn" id="autoRot" title="Rotation automatique"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5"/></svg></button>
        </div>
        <div class="hlbar" id="hlBar" hidden></div>
        <div class="loading" id="loading"><div>Chargement du modèle anatomique…</div><div class="lbar"><i id="loadBar"></i></div></div>
        <div class="tooltip" id="tooltip" hidden></div>
        <div class="gl-error" id="glError" hidden>Affichage 3D indisponible sur ce navigateur.<br>Utilise la liste des muscles ci-dessous.</div>
        <div class="credit">Modèle : Z-Anatomy / BodyParts3D · CC BY-SA 4.0</div>
      </div>
      <aside class="sheet" id="sheet" data-state="peek">
        <div class="sheet-head" id="sheetHead"></div>
        <div class="sheet-body" id="sheetBody"></div>
      </aside>
    </section>
    <section id="tab-library" class="tab"><div class="wrap" id="libraryView"></div></section>
    <section id="tab-session" class="tab"><div class="wrap" id="sessionView"></div></section>
  </main>

  <nav class="tabbar" id="tabs">
    <button data-tab="body" class="active"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2.2"/><path d="M5 9l7 1.5L19 9M12 10.5V15M12 15l-3 6M12 15l3 6"/></svg><span>Corps</span></button>
    <button data-tab="library"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg><span>Exercices</span></button>
    <button data-tab="session"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Séance</span></button>
  </nav>
</div>

<div class="page" id="page" hidden>
  <div class="page-card">
    <div class="page-head"><button class="back" id="pageBack"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Retour</button><div class="page-title" id="pageTitle"></div></div>
    <div class="page-body" id="pageBody"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="js/app.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
